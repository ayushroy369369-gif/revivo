<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fee Register | Glassmorphism 2.0</title>
<style>
:root{color-scheme:light;--bg:#f5f3ed;--card:#fffefa;--ink:#20332b;--mute:#718078;--line:#e5e1d7;--acc:#205b49;--accfg:#fff;--due:#a83e35;--duebg:#f8eae6;--ok:#28734d;--soft:#e8eee8;--shadow:0 8px 24px rgba(31,57,44,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#151b18;--card:#202824;--ink:#edf2ec;--mute:#a4b0a8;--line:#35413a;--acc:#75c4a5;--accfg:#10231b;--due:#ff9c91;--duebg:#3b2926;--ok:#8bd6a9;--soft:#29372f;--shadow:0 8px 24px rgba(0,0,0,.16)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#151b18;--card:#202824;--ink:#edf2ec;--mute:#a4b0a8;--line:#35413a;--acc:#75c4a5;--accfg:#10231b;--due:#ff9c91;--duebg:#3b2926;--ok:#8bd6a9;--soft:#29372f;--shadow:0 8px 24px rgba(0,0,0,.16)}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{transition:background .18s ease,transform .18s ease,box-shadow .18s ease}
button:active{transform:scale(.98)}
.wrap{max-width:980px;margin:0 auto;padding:26px 22px 110px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.brandline{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:750;margin-bottom:4px}
h1{font-size:clamp(25px,4vw,32px);letter-spacing:-.045em;line-height:1.15;margin:0}
.todayline{font-size:13px;color:var(--mute);margin-top:7px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
h2{font-size:17px;letter-spacing:-.02em;margin:0}
.search{position:relative;margin-bottom:18px}
.search input{width:100%;padding:13px 15px 13px 42px;border:1px solid var(--line);border-radius:13px;background:var(--card);outline:none;box-shadow:0 2px 6px rgba(0,0,0,.015)}
.search input:focus,dialog input:focus,dialog textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 14%,transparent)}
.search:before{content:"⌕";position:absolute;left:15px;top:6px;font-size:26px;color:var(--mute);pointer-events:none}
.results{position:absolute;left:0;right:0;top:100%;margin-top:5px;background:var(--card);border:1px solid var(--line);border-radius:13px;z-index:10;max-height:300px;overflow:auto;box-shadow:var(--shadow)}
.results div{padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.results div:hover{background:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow);min-width:0}
.stat .label{font-size:12px;color:var(--mute);font-weight:650;margin-bottom:8px}
.stat .value{font-size:clamp(20px,3vw,27px);font-weight:760;letter-spacing:-.045em;line-height:1.2;overflow-wrap:anywhere}
.stat .hint{font-size:12px;color:var(--mute);margin-top:7px}
.stat.due-stat .value{color:var(--due)}.stat.collected-stat .value{color:var(--ok)}
.tabs{display:flex;gap:5px;padding:5px;background:color-mix(in srgb,var(--line) 48%,var(--bg));border:1px solid var(--line);border-radius:14px;margin-bottom:13px;overflow-x:auto}
.tab{flex:1;min-width:max-content;border:0;border-radius:10px;padding:11px 14px;background:transparent;color:var(--mute);font-size:13px;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:16px;overflow:visible;box-shadow:var(--shadow);animation:fadeIn .22s ease}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 17px;border-bottom:1px solid var(--line)}
.head .tot{color:var(--mute);font-size:12px;white-space:nowrap}
.due .head{background:var(--duebg);border-radius:16px 16px 0 0}
.due .head h2,.due .amt{color:var(--due)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:background .16s ease}
.row:hover{background:color-mix(in srgb,var(--soft) 40%,var(--card))}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:12px;color:var(--mute);margin-top:3px}
.amt{font-weight:750;white-space:nowrap;font-size:14px}
.kebab{background:none;border:0;font-size:22px;line-height:1;padding:5px 10px;cursor:pointer;border-radius:9px;color:var(--mute)}
.kebab:hover{background:var(--bg)}
.menu{position:absolute;right:12px;top:46px;background:var(--card);border:1px solid var(--line);border-radius:12px;z-index:11;min-width:150px;box-shadow:var(--shadow);overflow:hidden}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 14px;cursor:pointer;font-size:13px}
.menu button:hover{background:var(--bg)}
.menu .del{color:var(--due)}
.empty{padding:26px 16px;color:var(--mute);font-size:14px;text-align:center}
.fab{position:fixed;left:25px;right:auto;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:var(--acc);color:var(--accfg);font-size:30px;cursor:pointer;box-shadow:0 9px 24px rgba(32,91,73,.28);z-index:20}
.fab:hover{box-shadow:0 12px 28px rgba(32,91,73,.36);transform:translateY(-2px)}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);width:min(500px,94vw);padding:22px;max-height:88vh;overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,.22)}
dialog::backdrop{background:rgba(15,25,20,.48);backdrop-filter:blur(3px)}
dialog h2{font-size:20px}
label{display:block;font-size:12px;font-weight:650;color:var(--mute);margin:14px 0 5px}
dialog input,dialog textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
.btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-weight:650}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.btn.p:hover{filter:brightness(1.06)}
.btn.small{padding:8px 11px}
.kv{display:grid;grid-template-columns:minmax(110px, .8fr) 1.2fr;gap:9px 14px;margin:17px 0;font-size:13px}
.kv span:nth-child(odd){color:var(--mute)}
.net{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:14px 0;padding:15px;background:var(--soft);border-radius:13px}
.pay{display:flex;gap:8px;margin-top:8px}.pay input{flex:1;min-width:0}
.hist{font-size:13px;margin-top:10px}
.hist div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.hist button{background:var(--duebg);border:0;border-radius:8px;padding:5px 8px;color:var(--due);cursor:pointer}
.ok{color:var(--ok)}.bad{color:var(--due)}
.report-line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
#toast{position:fixed;top:auto;bottom:96px;left:50%;right:auto;transform:translateX(-50%);margin:0;border:0;padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--bg);max-width:90vw;box-shadow:var(--shadow);font-size:13px}
[hidden]{display:none!important}
@keyframes fadeIn{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:640px){.wrap{padding:20px 14px 105px}.topbar{align-items:flex-start}.top-actions .btn{font-size:12px;padding:8px 9px}.stats{gap:8px}.stat{padding:12px;border-radius:13px}.stat .label{font-size:11px}.stat .hint{font-size:10px}.tabs{margin-left:-2px;margin-right:-2px}.tab{padding:10px 12px}.row{padding:13px 11px;gap:7px}.head{padding:14px 12px}.fab{right:17px;bottom:calc(17px + env(safe-area-inset-bottom,0px));border-radius:18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

/* Glassmorphism 2.0 — layered iOS glass, soft ambient colour and tactile depth */
:root{
  --glass-surface:rgba(255,255,255,.52);
  --glass-strong:rgba(255,255,255,.72);
  --glass-edge:rgba(255,255,255,.82);
  --glass-glow:rgba(115,129,255,.16);
  --shadow:0 24px 60px rgba(72,82,151,.10),0 5px 16px rgba(72,82,151,.055),inset 0 1px 0 rgba(255,255,255,.82);
}
html{min-height:100%;background:#f3f5ff}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#f5f7ff 0%,#edf0ff 34%,#f7f0ff 68%,#edf8ff 100%);
  background-attachment:fixed;
}
body:before{
  background:
    radial-gradient(ellipse at 4% 8%,rgba(130,151,255,.32),transparent 32%),
    radial-gradient(ellipse at 94% 13%,rgba(221,170,255,.30),transparent 29%),
    radial-gradient(ellipse at 78% 74%,rgba(141,218,255,.22),transparent 32%),
    radial-gradient(ellipse at 14% 92%,rgba(164,237,222,.20),transparent 30%);
  filter:saturate(112%);
}
.topbar{padding:4px 2px 10px}
.brandline{color:#6875e8}
h1{text-shadow:0 1px 0 rgba(255,255,255,.45)}
.search input{
  background:rgba(255,255,255,.48);
  border:1px solid rgba(255,255,255,.88);
  box-shadow:0 12px 30px rgba(75,85,155,.055),inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter:blur(28px) saturate(175%);
  -webkit-backdrop-filter:blur(28px) saturate(175%);
}
.search input::placeholder{color:#9298b0}
.results,.stat,section,.menu{
  position:relative;
  border:1px solid rgba(255,255,255,.78);
  background:rgba(255,255,255,.48);
  backdrop-filter:blur(30px) saturate(170%);
  -webkit-backdrop-filter:blur(30px) saturate(170%);
  box-shadow:0 22px 54px rgba(75,85,155,.085),0 5px 14px rgba(75,85,155,.045),inset 0 1px 0 rgba(255,255,255,.9);
}
.stat{
  overflow:hidden;
  border-radius:24px;
  background:linear-gradient(145deg,rgba(255,255,255,.77),rgba(255,255,255,.36));
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.stat:before,section:before,dialog:before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(135deg,rgba(255,255,255,.34),transparent 38%,rgba(255,255,255,.08));
}
.stat:hover{transform:translateY(-2px);box-shadow:0 27px 62px rgba(75,85,155,.12),inset 0 1px 0 rgba(255,255,255,.95)}
.stat.due-stat{background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,224,233,.56))}
.stat.collected-stat{background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(211,249,239,.57))}
.stat .label,.stat .value,.stat .hint{position:relative;z-index:1}
.tabs{background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 2px rgba(72,82,151,.04);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%)}
.tab[aria-selected="true"]{background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(255,255,255,.73));box-shadow:0 5px 14px rgba(70,79,147,.10),inset 0 1px 0 #fff}
section{overflow:hidden;border-radius:23px;background:rgba(255,255,255,.43)}
.head{background:rgba(255,255,255,.20);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.due .head{background:linear-gradient(110deg,rgba(255,226,234,.74),rgba(255,246,249,.35))}
.row{background:transparent;transition:background .18s ease}
.row:hover{background:rgba(255,255,255,.44)}
.row:active{background:rgba(111,126,239,.08)}
.kebab:hover{background:rgba(255,255,255,.72)}
.menu{background:rgba(255,255,255,.82);backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%)}
.fab{
  border:1px solid rgba(255,255,255,.62);
  background:linear-gradient(145deg,rgba(139,151,255,.98),rgba(88,101,229,.98) 58%,rgba(115,89,218,.98));
  box-shadow:0 16px 34px rgba(86,99,226,.30),0 4px 10px rgba(86,99,226,.16),inset 0 1px 0 rgba(255,255,255,.55);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.fab:hover{box-shadow:0 20px 40px rgba(86,99,226,.37),inset 0 1px 0 rgba(255,255,255,.65)}
dialog{
  position:relative;
  background:rgba(249,250,255,.79);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 35px 100px rgba(34,39,82,.24),inset 0 1px 0 rgba(255,255,255,.95);
  backdrop-filter:blur(36px) saturate(165%);
  -webkit-backdrop-filter:blur(36px) saturate(165%);
}

dialog::backdrop{background:rgba(37,43,82,.22);backdrop-filter:blur(12px) saturate(120%);-webkit-backdrop-filter:blur(12px) saturate(120%)}

.btn.p{background:linear-gradient(135deg,#7d8aff,#5967e8 62%,#7660dd);box-shadow:0 7px 17px rgba(89,103,232,.23),inset 0 1px 0 rgba(255,255,255,.28)}

#toast{background:rgba(37,42,72,.82);color:#fff;border:1px solid rgba(255,255,255,.24);box-shadow:0 16px 38px rgba(35,39,80,.22);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass-surface:rgba(31,35,59,.55);--glass-strong:rgba(34,39,65,.78);--glass-edge:rgba(177,187,255,.20);--shadow:0 24px 60px rgba(0,0,0,.25),0 5px 16px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.07)}
:root:not([data-theme="light"]) body:before{background:radial-gradient(ellipse at 4% 8%,rgba(94,111,255,.24),transparent 32%),radial-gradient(ellipse at 94% 13%,rgba(171,101,229,.20),transparent 29%),radial-gradient(ellipse at 78% 74%,rgba(58,159,209,.15),transparent 32%),radial-gradient(ellipse at 14% 92%,rgba(64,178,153,.12),transparent 30%)}
:root:not([data-theme="light"]) .results,:root:not([data-theme="light"]) .stat,:root:not([data-theme="light"]) section,:root:not([data-theme="light"]) .menu{background:rgba(29,33,54,.58);border-color:rgba(184,191,255,.17);box-shadow:0 22px 54px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08)}

:root:not([data-theme="light"]) dialog{background:rgba(29,33,54,.83);border-color:rgba(184,191,255,.2)}
:root:not([data-theme="light"]) dialog input,:root:not([data-theme="light"]) dialog textarea{background:rgba(17,21,39,.62);border-color:rgba(184,191,255,.18)}
:root:not([data-theme="light"]) .btn{background:rgba(45,50,79,.58);border-color:rgba(184,191,255,.18)}

}
:root[data-theme="dark"] .results,:root[data-theme="dark"] .stat,:root[data-theme="dark"] section,:root[data-theme="dark"] .menu{background:rgba(29,33,54,.58);border-color:rgba(184,191,255,.17);box-shadow:0 22px 54px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08)}

@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){.results,.stat,section,.menu,dialog,.tabs,.search input{background:rgba(255,255,255,.94)}:root[data-theme="dark"] .results,:root[data-theme="dark"] .stat,:root[data-theme="dark"] section,:root[data-theme="dark"] .menu,:root[data-theme="dark"] dialog{background:#20243a}}
@media(max-width:640px){.wrap{padding-top:22px}.stat{border-radius:20px}.topbar{margin-bottom:18px}section{border-radius:20px}.row{padding:14px 12px}}
@media(prefers-reduced-motion:reduce){.stat{transition:none}}

/* Explicit, persistent light/dark mode control */
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;background:var(--glass-strong,rgba(255,255,255,.72));border-color:var(--glass-edge,rgba(255,255,255,.82));backdrop-filter:blur(18px) saturate(155%);-webkit-backdrop-filter:blur(18px) saturate(155%)}
.theme-icon{font-size:16px;line-height:1}
html,body,.stat,section,.tabs,.search input,dialog,.btn,.menu,.results{transition:background-color .22s ease,color .22s ease,border-color .22s ease,box-shadow .22s ease}

@media(max-width:640px){.theme-toggle{padding:8px 10px}.top-actions{gap:6px}}

<body>
<div class="wrap">
  <header class="topbar">
    <div><div class="brandline">Tuition management</div><h1>Fee Register</h1><div class="todayline" id="todayLine"></div></div>
    <div class="top-actions">
      <button class="btn small theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><span class="theme-icon" aria-hidden="true">☾</span><span id="themeLabel">Dark mode</span></button>
      <button class="btn small" id="backupBtn" type="button">Backup</button>
      <button class="btn small" id="restoreBtn" type="button">Restore</button>
      <input id="restoreFile" type="file" accept="application/json,.json" hidden>
    </div>
  </header>
  <div class="stats">
    <div class="stat due-stat"><div class="label">Outstanding fees</div><div class="value" id="sumDue">₹0</div><div class="hint" id="sumDueHint">Across pending students</div></div>
    <div class="stat"><div class="label">Active students</div><div class="value" id="sumStudents">0</div><div class="hint">Currently studying</div></div>
    <div class="stat collected-stat"><div class="label">Collected this month</div><div class="value" id="sumCollected">₹0</div><div class="hint" id="sumCollectedHint">Payments received this month</div></div>
  </div>
  <div class="search">
    <input id="q" placeholder="Search student by name…" autocomplete="off" aria-label="Search students by name">
    <div class="results" id="res" hidden></div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Student categories">
    <button class="tab" role="tab" id="tabDue" aria-controls="panelDue" aria-selected="true" data-tab="due">Due Fees <span id="dueTabCount"></span></button>
    <button class="tab" role="tab" id="tabAct" aria-controls="panelAct" aria-selected="false" data-tab="act">Present Students <span id="actTabCount"></span></button>
    <button class="tab" role="tab" id="tabCut" aria-controls="panelCut" aria-selected="false" data-tab="cut">Name Cutted <span id="cutTabCount"></span></button>
  </nav>
  <section class="due" id="panelDue" role="tabpanel" aria-labelledby="tabDue"><div class="head"><h2>Due Fees</h2><span class="tot" id="dueTot"></span></div><div id="dueList"></div></section>
  <section id="panelAct" role="tabpanel" aria-labelledby="tabAct" hidden><div class="head"><h2>Present Students</h2><span class="tot" id="actTot"></span></div><div id="actList"></div></section>
  <section id="panelCut" role="tabpanel" aria-labelledby="tabCut" hidden><div class="head"><h2>Name Cutted</h2><span class="tot" id="cutTot"></span></div><div id="cutList"></div></section>
</div>
<button class="fab" id="fab" aria-label="Add student">+</button>

<dialog id="dForm">
  <h2 id="fTitle">Add student</h2>
  <label>Student name</label><input id="fName">
  <label>Date of joining</label><input id="fDate" type="date">
  <label>Fees per month (₹)</label><input id="fFee" type="number" min="0" inputmode="numeric">
  <label>Mobile number (optional)</label><input id="fMob" type="tel">
  <label>Note (optional)</label><textarea id="fNote" rows="2"></textarea>
  <div class="btns"><button class="btn" data-close>Cancel</button><button class="btn p" id="fSave">Save</button></div>
</dialog>
<dialog id="dView"><div id="vBody"></div></dialog>
<dialog id="dAsk"><p id="aMsg"></p><div class="btns"><button class="btn" data-close>Cancel</button><button class="btn p" id="aOk">Yes</button></div></dialog>
<div id="toast" popover="manual"></div>

<script>
const KEY="tuition_fee_v1";
let S=[];
try{S=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){S=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const THEME_KEY="tuition_fee_theme_v1";
function applyTheme(theme, persist=true){
  const chosen=theme==="dark"?"dark":"light";
  document.documentElement.dataset.theme=chosen;
  const dark=chosen==="dark";
  const icon=document.querySelector("#themeToggle .theme-icon");
  if(icon)icon.textContent=dark?"☀":"☾";
  $("themeLabel").textContent=dark?"Light mode":"Dark mode";
  $("themeToggle").setAttribute("aria-label",dark?"Switch to light mode":"Switch to dark mode");
  $("themeToggle").setAttribute("aria-pressed",String(dark));
  if(persist){try{localStorage.setItem(THEME_KEY,chosen)}catch(e){}}
}
let initialTheme="light";
try{const savedTheme=localStorage.getItem(THEME_KEY);initialTheme=savedTheme==="dark"||savedTheme==="light"?savedTheme:(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}
applyTheme(initialTheme,false);
$("themeToggle").addEventListener("click",()=>applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"));
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fd=s=>pd(s).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
const esc=t=>String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function addM(d,n){const t=new Date(d.getFullYear(),d.getMonth()+n,1);const dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return new Date(t.getFullYear(),t.getMonth(),Math.min(d.getDate(),dim))}
function feeAt(s,date){
  const changes=Array.isArray(s.feeChanges)?s.feeChanges.slice():[];
  changes.push({date:s.joined,fee:Number(s.initialFee??s.fee)});
  changes.sort((a,b)=>a.date.localeCompare(b.date));
  let rate=Number(s.initialFee??s.fee);
  for(const change of changes){if(change.date<=date)rate=Number(change.fee);else break}
  return rate;
}
function calc(s){
  const st=pd(s.joined),end=s.status==="left"?pd(s.leftDate):today();
  let m=(end.getFullYear()-st.getFullYear())*12+end.getMonth()-st.getMonth();
  if(m<0)m=0;
  while(m>0&&addM(st,m)>end)m--;
  const days=Math.max(0,Math.round((end-addM(st,m))/864e5));
  let billed=0;
  for(let i=0;i<m;i++)billed+=feeAt(s,iso(addM(st,i)));
  const paid=(s.pays||[]).reduce((a,p)=>a+Number(p.amt||0),0);
  const nextDate=iso(addM(st,m));
  return{m,days,billed,paid,due:billed-paid,nextDate};
}
const tenure=c=>`${c.m} month${c.m==1?"":"s"} ${c.days} day${c.days==1?"":"s"}`;
function row(s,c,showDue){
  const left=s.status==="left";
  const sub=showDue?`${tenure(c)} · ${inr(s.fee)}/month${left?" · left":""}`:`Joined ${fd(s.joined)} · ${inr(s.fee)}/month`;
  const amt=showDue?`<span class="amt">${inr(c.due)}</span>`:(c.due>0?`<span class="amt bad">${inr(c.due)}</span>`:"");
  return `<div class="row" data-open="${s.id}"><div class="main"><div class="nm">${esc(s.name)}</div><div class="sub">${sub}</div></div>${amt}
  <button class="kebab" data-kb="${s.id}" aria-label="Options">⋮</button></div>`;
}
function render(){
  const all=S.map(s=>({s,c:calc(s)}));
  const due=all.filter(x=>x.c.due>0).sort((a,b)=>b.c.due-a.c.due);
  const act=all.filter(x=>x.s.status!=="left").sort((a,b)=>a.s.name.localeCompare(b.s.name));
  const cut=all.filter(x=>x.s.status==="left").sort((a,b)=>a.s.name.localeCompare(b.s.name));
  $("dueList").innerHTML=due.map(x=>row(x.s,x.c,true)).join("")||'<div class="empty">No pending fees. Everything is up to date.</div>';
  $("actList").innerHTML=act.map(x=>row(x.s,x.c,false)).join("")||'<div class="empty">No students yet. Tap + to add one.</div>';
  $("cutList").innerHTML=cut.map(x=>row(x.s,x.c,false)).join("")||'<div class="empty">No students have left.</div>';
  $("dueTot").textContent=due.length?`${due.length} students · ${inr(due.reduce((a,x)=>a+x.c.due,0))}`:"No pending balance";
  $("actTot").textContent=act.length+" students";
  $("cutTot").textContent=cut.length+" students";
  $("dueTabCount").textContent=due.length?`(${due.length})`:"";
  $("actTabCount").textContent=`(${act.length})`;
  $("cutTabCount").textContent=`(${cut.length})`;
  $("sumDue").textContent=inr(due.reduce((a,x)=>a+x.c.due,0));
  $("sumDueHint").textContent=`${due.length} student${due.length===1?"":"s"} with pending fees`;
  $("sumStudents").textContent=act.length;
  const monthPrefix=iso(today()).slice(0,7);
  const collected=S.reduce((sum,s)=>sum+(s.pays||[]).filter(p=>String(p.date||"").startsWith(monthPrefix)).reduce((a,p)=>a+Number(p.amt||0),0),0);
  $("sumCollected").textContent=inr(collected);
  $("sumCollectedHint").textContent=new Date().toLocaleDateString("en-IN",{month:"long",year:"numeric"});
  $("todayLine").textContent=today().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{
  const key=b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach(t=>t.setAttribute("aria-selected",String(t===b)));
  $("panelDue").hidden=key!=="due";$("panelAct").hidden=key!=="act";$("panelCut").hidden=key!=="cut";
}));
let tt,askCb;
function toast(m){const t=$("toast");t.textContent=m;try{t.showPopover()}catch(e){}clearTimeout(tt);tt=setTimeout(()=>{try{t.hidePopover()}catch(e){}},2500)}
function ask(m,cb){$("aMsg").textContent=m;askCb=cb;$("dAsk").showModal()}
$("aOk").onclick=()=>{$("dAsk").close();if(askCb)askCb()};
/* menu */
function closeMenus(){document.querySelectorAll(".menu").forEach(m=>m.remove())}
document.addEventListener("click",e=>{
  const kb=e.target.closest("[data-kb]");
  if(kb){e.stopPropagation();const id=kb.dataset.kb,r=kb.closest(".row"),had=r.querySelector(".menu");closeMenus();if(had)return;
    const s=S.find(x=>x.id==id),left=s.status==="left";
    const m=document.createElement("div");m.className="menu";
    m.innerHTML=`<button data-act="edit" data-id="${id}">Edit</button><button data-act="${left?"rejoin":"cut"}" data-id="${id}">${left?"Rejoin":"Cut name"}</button><button class="del" data-act="del" data-id="${id}">Delete</button>`;
    r.appendChild(m);return}
  const a=e.target.closest("[data-act]");
  if(a){e.stopPropagation();const id=a.dataset.id;closeMenus();act(a.dataset.act,id);return}
  closeMenus();
  const o=e.target.closest("[data-open]");
  if(o){openView(o.dataset.open);return}
  const r=e.target.closest("[data-res]");
  if(r){$("res").hidden=true;$("q").value="";openView(r.dataset.res);return}
  if(!e.target.closest(".search"))$("res").hidden=true;
  if(e.target.closest("[data-close]"))e.target.closest("dialog").close();
});
function act(a,id){
  const s=S.find(x=>x.id==id);if(!s)return;
  if(a==="edit")openForm(s);
  else if(a==="cut"){s.status="left";s.leftDate=iso(today());save();render();toast(s.name+" moved to Name Cutted")}
  else if(a==="rejoin"){s.status="active";delete s.leftDate;save();render()}
  else if(a==="del"){ask(`Delete ${s.name} and all their records permanently?`,()=>{S=S.filter(x=>x.id!=id);save();render()})}
}
/* form */
let editId=null;
function openForm(s){
  editId=s?s.id:null;$("fTitle").textContent=s?"Edit student":"Add student";
  $("fName").value=s?s.name:"";$("fDate").value=s?s.joined:iso(today());$("fFee").value=s?s.fee:"";
  $("fMob").value=s?s.mobile:"";$("fNote").value=s?s.note:"";$("dForm").showModal();
}
$("fab").onclick=()=>openForm(null);
$("fSave").onclick=()=>{
  const name=$("fName").value.trim(),joined=$("fDate").value,fee=parseFloat($("fFee").value);
  if(!name||!joined||isNaN(fee)||fee<0){toast("Please enter name, date of joining and fees per month.");return}
  const d={name,joined,fee,mobile:$("fMob").value.trim(),note:$("fNote").value.trim()};
  if(editId){
    const existing=S.find(x=>x.id==editId);
    if(existing){
      if(Number(existing.fee)!==fee){
        if(!Array.isArray(existing.feeChanges))existing.feeChanges=[];
        if(existing.initialFee==null)existing.initialFee=Number(existing.fee);
        existing.feeChanges.push({date:iso(today()),fee});
      }
      Object.assign(existing,d);
    }
  } else S.push({id:Date.now(),status:"active",pays:[],initialFee:fee,feeChanges:[],...d});
  save();render();$("dForm").close();
};
/* detail */
let viewId=null;
function openView(id){viewId=id;drawView();$("dView").showModal()}
function drawView(){
  const s=S.find(x=>x.id==viewId);if(!s){$("dView").close();return}
  const c=calc(s),left=s.status==="left";
  const net=c.due>0?`<span class="bad">${inr(c.due)} due</span>`:c.due<0?`<span class="ok">${inr(-c.due)} advance</span>`:`<span class="ok">All clear</span>`;
  $("vBody").innerHTML=`<h2>${esc(s.name)}</h2>
  <div class="kv"><span>Status</span><span>${left?"Left on "+fd(s.leftDate):"Studying"}</span>
  <span>Joined</span><span>${fd(s.joined)}</span>
  <span>Time completed</span><span>${tenure(c)}</span>
  <span>Next billing date</span><span>${left?"—":fd(c.nextDate)}</span>
  <span>Fees per month</span><span>${inr(s.fee)}</span>
  <span>Mobile</span><span>${esc(s.mobile)||"—"}</span>
  <span>Note</span><span>${esc(s.note)||"—"}</span>
  <span>Total fees</span><span>${inr(c.billed)}</span>
  <span>Received</span><span>${inr(c.paid)}</span></div>
  <div class="net">Net fees: ${net}</div>
  <label>Received money (₹)</label>
  <div class="pay"><input id="pAmt" type="number" min="1" inputmode="numeric" placeholder="Amount"><button class="btn p" id="pBtn">Received money</button></div>
  <div class="hist">${s.pays.slice().reverse().map(p=>`<div><span>${fd(p.date)}</span><span>${inr(p.amt)} <button data-undo="${p.id}" title="Correct or remove payment" aria-label="Remove payment">Remove</button></span></div>`).join("")||'<span style="color:var(--mute)">No payments received yet.</span>'}</div>
  <div class="btns"><button class="btn" data-close>Close</button></div>`;
  $("pBtn").onclick=()=>{const a=parseFloat($("pAmt").value);if(!(a>0)){toast("Enter the amount received.");return}
    s.pays.push({id:Date.now(),date:iso(today()),amt:a});save();render();drawView()};
  $("vBody").querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>{ask("Remove this payment?",()=>{s.pays=s.pays.filter(p=>p.id!=b.dataset.undo);save();render();drawView()})});
}
/* search */
$("q").oninput=()=>{
  const t=$("q").value.trim().toLowerCase(),r=$("res");
  if(!t){r.hidden=true;return}
  const m=S.filter(s=>s.name.toLowerCase().includes(t)).slice(0,8);
  r.innerHTML=m.map(s=>{const c=calc(s);return `<div data-res="${s.id}"><span>${esc(s.name)}${s.status==="left"?" (left)":""}</span><span class="${c.due>0?"bad":"ok"}">${c.due>0?inr(c.due)+" due":"Clear"}</span></div>`}).join("")||'<div style="color:var(--mute)">No student found</div>';
  r.hidden=false;
};
$("backupBtn").onclick=()=>{
  const payload={app:"Tuition Fee Register",version:1,exportedAt:new Date().toISOString(),students:S};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="tuition-fee-backup-"+iso(today())+".json";a.click();URL.revokeObjectURL(url);
  toast("Backup downloaded.");
};
$("restoreBtn").onclick=()=>$("restoreFile").click();
$("restoreFile").onchange=async()=>{
  const file=$("restoreFile").files[0];if(!file)return;
  try{
    const parsed=JSON.parse(await file.text());
    const incoming=Array.isArray(parsed)?parsed:parsed.students;
    if(!Array.isArray(incoming)||incoming.some(s=>!s||typeof s.name!=="string"||!s.joined||!Number.isFinite(Number(s.fee)))){
      throw new Error("This file does not look like a valid tuition backup.");
    }
    ask("Restore this backup and replace the student records currently in this browser?",()=>{
      S=incoming.map(s=>({...s,pays:Array.isArray(s.pays)?s.pays:[],status:s.status==="left"?"left":"active"}));
      save();render();toast("Backup restored.");
    });
  }catch(e){toast(e.message||"Could not read this backup file.");}
  $("restoreFile").value="";
};
render();
</script>
</body>
</html>
